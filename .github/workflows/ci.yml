name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Both platforms mavis ships for. macOS is here because the editor
    # shell-out and the terminal check behave differently there, and a
    # Linux-only run would never exercise them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...

      # -race matters: the store holds an in-process mutex as well as a file
      # lock because flock does not serialise goroutines, and that is only
      # visible under the detector.
      - run: go test -race ./...
